[package]
name = "cambium-winit"
version = "0.3.0"
description = "winit input translation for Cambium applications"
edition.workspace = true
rust-version = "1.92"
license = "MPL-2.0"
repository = "https://github.com/mark-ik/genet"
publish = true

# Two dependencies, and it stays that way. The a11y host moved to
# `cambium-winit-a11y` on 2026-07-26 because its genet deps (`genet-layout`,
# `genet-winit-host`) inherit `publish = false` and made this crate
# unpublishable with them. Adding anything unpublishable here undoes that.
[dependencies]
cambium = { version = "0.3.2", path = "../cambium" }
winit = "0.30.13"
