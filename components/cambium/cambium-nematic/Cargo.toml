[package]
name = "cambium-nematic"
version = "0.3.1"
description = "Cambium-native views and themes for Nematic smolweb content"
edition.workspace = true
rust-version = "1.92"
license = "MPL-2.0"
repository = "https://github.com/merely-made/genet"
readme = "README.md"
publish = true

[dependencies]
cambium = { version = "0.3.0", path = "../cambium" }
# `workspace = true`, not a bare version: a bare `errand = "0.1.3"` resolved to
# the *published* crate rather than this workspace's copy, so local changes to
# errand never reached these views and the tests here silently exercised
# crates.io instead.
errand = { workspace = true }

[dev-dependencies]
layout_dom_api = { package = "layout-dom-api", path = "../../shared/layout-dom" }
genet-scripted-dom = { path = "../../genet-scripted-dom" }
