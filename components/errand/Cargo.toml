[package]
name = "errand"
# 0.2.0, not 0.1.4: `parse::gopher::GopherItem` gained its Gopher+ marker
# field when the grammar moved to gopher-protocol, and in 0.x the minor
# version is the breaking position.
version = "0.2.0"
edition = "2024"
# Own license line, not workspace: errand predates the genet adoption and is
# published MIT/Apache (founding convention); genet's workspace default is MPL.
license = "MIT OR Apache-2.0"
description = "Async small-web (smolweb) transport: gemini, gopher, finger, spartan, nex, guppy, and titan in one scheme-routed fetch, plus titan-upload and misfin-send write companions. Bytes in, bytes out, no HTTP, host-agnostic."
repository = "https://github.com/merely-made/genet"
# Override genet's workspace-wide publish = false: errand is a published crate.
publish = true
keywords = ["gemini", "gopher", "smolweb", "nex", "guppy"]
categories = ["network-programming"]
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
# The `parse` module (gemtext/gopher/nex/feed) compiles unconditionally: the
# dep-free parsers cost nothing, and the feed parser's quick-xml is light enough
# to keep as a plain dependency rather than a gate. (A cargo feature added in a
# sibling repo is invisible to its dependents until the crate is pushed, which
# made a `parse-feed` gate impractical in this workspace.)
default = []
# Serving: errand's other direction. Off by default, because a browser must
# never carry listeners it will not run. Turns on the `server` half of each
# protocol crate, which is where the wire work lives; what errand adds is the
# `Source` trait and the projection of one source into each native format.
serve = [
    "gemini-protocol/server",
    "gopher-protocol/server",
    "finger-protocol/server",
]

[dependencies]
url = "2.5"
# The Guppy protocol transaction (spec v0.4.4: acks, retransmission, chunk
# reassembly) lives in its own spec-faithful crate; errand adapts its response.
# The three protocol crates are workspace members under protocols/ (adopted
# 2026-07-10 with errand), each keeping its own published crate identity.
guppy-protocol = { workspace = true }
# Spartan and nex transactions live in their spec-faithful sibling crates.
spartan-protocol = { workspace = true }
nex-protocol = { workspace = true }
# Gopher and finger followed on 2026-08-03. gopher-protocol also owns the
# gophermap grammar (`parse::gopher` re-exports it) and the Gopher+ successor;
# finger-protocol also carries WebFinger, which errand deliberately does not
# enable, since WebFinger is HTTP and errand does not speak HTTP.
gopher-protocol = { workspace = true }
finger-protocol = { workspace = true }
# Gemini, the gemtext grammar, TOFU pinning, and titan all followed on
# 2026-08-03: one spec, one crate. `parse::gemtext` re-exports its grammar and
# the TOFU types are re-exported at errand's root, so hosts keep their paths.
gemini-protocol = { workspace = true }
# Misfin send delegates to the misfin crate's client, on the same ring
# provider this crate builds rustls with (no C toolchain).
misfin = { version = "0.0.4", default-features = false, features = ["client", "ring"] }
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time"] }
# rustls stays for misfin alone: its `ClientIdentity` is typed in rustls's
# pki_types. Gemini's TLS and the TOFU verifier moved to gemini-protocol.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# RSS / Atom feed parsing (`parse::feed`). A light pure-Rust XML reader; kept an
# unconditional dep (the cross-repo feature wall made a `parse-feed` gate
# impractical, and quick-xml is small relative to the rustls/tokio cone).
quick-xml = "0.39"
# Host-neutral tracing facade: errand only *emits* structured events on the
# load-bearing fetch op; the consuming app installs the subscriber. No dep on any
# app or diagnostics registry.
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util"] }
